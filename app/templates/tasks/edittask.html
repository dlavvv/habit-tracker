<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Task</title>
</head>
<body>
    <h1>Edit Task</h1>

    <form action="" method="post">
        {{ form.hidden_tag() }}

        <p>
            {{ form.description.label }}<br>
            {{ form.description(size=40) }}
        </p>
        <p>
            {{ form.completed.label }}
            {{ form.completed() }}
        </p>
        <p>{{ form.submit() }}</p>
    </form>
</body>
</html>
