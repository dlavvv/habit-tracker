<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Task</title>
</head>
<body>
  <h1>Create a new task</h1>
  <form action="" method="post" novalidate>
    {{ form.hidden_tag() }}
    <p>
        {{ form.description.label }}<br>
        {{ form.description(size=50) }}
    </p>
    <p> {{ form.submit() }}</p>
  </form>
</body>
</html>
