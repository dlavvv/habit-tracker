<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Habit</title>
</head>
<body>
    <h1>Create a new habit</h1>
  <form action="" method="post" novalidate>
    {{ form.hidden_tag() }}
    <p>
        {{ form.name.label }}<br>
        {{ form.name(size=30) }}
    </p>
      <p>{{ form.submit() }}</p>
  </form>
</body>
</html>
