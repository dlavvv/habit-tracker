{% extends "base.html" %}

{% block content %}
<ul>
    {% for habit in all_habits %}
        <li>{{ habit.name }}</li>
        <button type="button" onclick="window.location.href='/edithabit/{{ habit.id }}'">Edit Habit</button>
        <button type="button" onclick="window.location.href='/deletehabit/{{ habit.id }}'">Delete Habit</button>
    {% endfor %}
</ul>

{% endblock %}
